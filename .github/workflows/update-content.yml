name: 📝 Update Content Submodule

on:
  repository_dispatch:
    types: [update-content]
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout quartz
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: false
      
      - name: 🔐 Configure Git credentials
        run: |
          git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      
      - name: 🔄 Update submodule to latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialiser et mettre à jour le submodule
          git submodule sync
          git submodule update --init --remote content
          
          # Vérifier s'il y a des changements
          if git diff --quiet content; then
            echo "No changes to content submodule"
            exit 0
          fi
          
          # Commit et push les changements
          git add content
          git commit -m "📝 Auto-update content submodule to latest"
          git push origin v4
